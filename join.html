<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Join Form Page - Multi-Page College Club -->
    <meta charset="UTF-8">
    <title>Tech Club - Join</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Common Header + Navigation -->
    <header>
        <div class="container navbar">
            <div class="logo">Tech Club</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="join.html" class="active">Join</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Join Form Content -->
    <main class="container">
        <section class="join-section">
            <h2>Join the Tech Club</h2>
            <p>Please fill in the form below to register as a club member.</p>

            <!-- Properly styled form with required fields -->
            <form action="#" method="post">
                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <!-- Branch -->
                <div class="form-group">
                    <label for="branch">Branch:</label>
                    <select id="branch" name="branch" required>
                        <option value="">-- Select Branch --</option>
                        <option value="CSE">CSE</option>
                        <option value="IT">IT</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                    </select>
                </div>

                <!-- Year -->
                <div class="form-group">
                    <label for="year">Year:</label>
                    <select id="year" name="year" required>
                        <option value="">-- Select Year --</option>
                        <option value="1st">1st Year</option>
                        <option value="2nd">2nd Year</option>
                        <option value="3rd">3rd Year</option>
                        <option value="4th">4th Year</option>
                    </select>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Submit Button -->
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2025 Tech Club. All rights reserved.
    </footer>
</body>
</html>
